name: Onda private account diagnostic
on: workflow_dispatch
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Check conditional storage validators without exposing credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ONDA_SYNTHETIC_USER_ID: user_3KOxBaHH7A1IIjuDQNr0R4P6iYz
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,hashlib
          def request(url,headers):
           with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
            return dict(r.headers),r.read(65536)
          token=os.environ['VERCEL_TOKEN'];project='prj_uFRebtKoS8lCrM9fqxXMJkgYDGfr';team='team_n6dJgfB2eKLbYATPalhDgptx'
          _,raw=request('https://api.vercel.com/v9/projects/'+project+'/env?decrypt=true&teamId='+team,{'Authorization':'Bearer '+token})
          env=json.loads(raw)['envs'];selected=next(x for x in env if x['key']=='BLOB_READ_WRITE_TOKEN' and 'preview' in x['target'])
          _,detail=request('https://api.vercel.com/v1/projects/'+project+'/env/'+selected['id']+'?teamId='+team,{'Authorization':'Bearer '+token})
          rw=json.loads(detail)['value']
          store='AEqZXW8tYvdxFB44';path='accounts/v1/'+hashlib.sha256(os.environ['ONDA_SYNTHETIC_USER_ID'].encode()).hexdigest()+'.json'
          headers={'Authorization':'Bearer '+rw,'x-vercel-blob-store-id':store,'x-api-version':'11'}
          read_headers,raw=request('https://'+store+'.private.blob.vercel-storage.com/'+path+'?cache=0',headers)
          body=json.loads(raw);etag=next(v for k,v in read_headers.items() if k.lower()=='etag')
          _,head_raw=request('https://vercel.com/api/blob?'+urllib.parse.urlencode({'url':path}),headers)
          head=json.loads(head_raw);expected=head.get('etag','')
          print(json.dumps({'revision':body['revision'],'readEtagQuoted':etag.startswith('"'),'readEtagWeak':etag.startswith('W/'),'readEtagLength':len(etag),'headEtagLength':len(expected),'sameEtag':etag==expected,'unquotedSameEtag':etag.strip('"')==expected,'readEncoding':next((v for k,v in read_headers.items() if k.lower()=='content-encoding'),None)}))
          PY
