name: Onda Component Watch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onda-component-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: onda-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check official stable component releases without deployment secrets
        id: versions
        run: |
          python -m pip install --require-hashes -r scripts/component-watch-requirements.txt
          python scripts/autocura.py check-updates > component-check.json
          python -c "import json, os; d=json.load(open('component-check.json')); print(json.dumps(d)); f=open(os.environ['GITHUB_OUTPUT'], 'a'); f.write('required=' + str(d['required']).lower() + '\n'); f.close()"
      - name: Dispatch the existing tested release pipeline when needed
        if: steps.versions.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow onda-autocura.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = '0' ]; then
            gh workflow run onda-autocura.yml --ref main -f command=release -f force=false
          else
            printf 'AutoCura already has an active execution; duplicate dispatch skipped.\n'
          fi
