name: Onda browser quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onda-web/public/**'
      - 'onda-web/tests/test_*browser*.py'
      - 'onda-web/tests/test_session_store.py'
      - '.github/workflows/onda-browser-quality.yml'
  pull_request:
    paths:
      - 'onda-web/public/**'
      - 'onda-web/tests/test_*browser*.py'
      - 'onda-web/tests/test_session_store.py'
      - '.github/workflows/onda-browser-quality.yml'
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: onda-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: onda-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the reviewed application and browser test tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 playwright==1.63.0
          npm install --prefix artifacts/a11y --no-save --package-lock=false axe-core@4.11.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Verify storage, encryption, history and responsive panels
        env:
          ONDA_AXE_PATH: artifacts/a11y/node_modules/axe-core/axe.min.js
          ONDA_TEST_BROWSERS: ${{ matrix.engine }}
        run: python -m pytest -q tests/test_session_store.py tests/test_maintenance_center_browser.py tests/test_history_storage_browsers.py tests/test_browser_media_flow.py tests/test_experience_browser.py --junitxml=artifacts/browser-${{ matrix.engine }}.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onda-browser-${{ matrix.engine }}
          path: onda-web/artifacts/browser-${{ matrix.engine }}.xml
          if-no-files-found: ignore
          retention-days: 14
