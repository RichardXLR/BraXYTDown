name: Onda AutoCura 3.0

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Update and verify, test the active deployment, or roll back'
        type: choice
        options: [release, test, rollback]
        default: release
      force:
        description: 'Manually retry quarantined versions'
        type: boolean
        default: false

permissions:
  contents: write

# Never run two promotions at once, including manual and scheduled executions.
concurrency:
  group: onda-autocura-production
  cancel-in-progress: false

jobs:
  compatibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # This workflow belongs at the REPOSITORY root. The website is isolated
    # below onda-web/ so the existing BraXYTDown desktop project is preserved.
    defaults:
      run:
        working-directory: onda-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate reviewed source before using deployment credentials
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 httpx==0.28.1
          python -m pytest -q
          npm install -g vercel@62.7.0
      - name: Verify Vercel CLI connection before preparing an update
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_n6dJgfB2eKLbYATPalhDgptx' }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_uFRebtKoS8lCrM9fqxXMJkgYDGfr' }}
        run: vercel pull --yes --environment=preview
      - name: Build an immutable candidate, verify it, and promote or recover
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_n6dJgfB2eKLbYATPalhDgptx' }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || 'team_n6dJgfB2eKLbYATPalhDgptx' }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_uFRebtKoS8lCrM9fqxXMJkgYDGfr' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          AUTOCURA_AUDIO_CANARY_URL: ${{ vars.AUTOCURA_AUDIO_CANARY_URL || 'https://onda-audio.vercel.app/canary.wav' }}
          AUTOCURA_VIDEO_CANARY_URL: ${{ vars.AUTOCURA_VIDEO_CANARY_URL || 'https://onda-audio.vercel.app/canary.mp4' }}
          AUTOCURA_YOUTUBE_AUDIO_CANARY_URL: ${{ vars.AUTOCURA_YOUTUBE_AUDIO_CANARY_URL }}
          # Keep a known, identical YouTube IP block visible. This never skips
          # a new extraction failure or any converter/application regression.
          AUTOCURA_YOUTUBE_POLICY: baseline
          AUTOCURA_REPOSITORY_SUBDIRECTORY: onda-web
          AUTOCURA_PRODUCTION_URL: https://onda-audio.vercel.app
          GITHUB_TOKEN: ${{ github.token }}
          CURE_COMMAND: ${{ inputs.command || 'release' }}
          CURE_FORCE: ${{ inputs.force || false }}
        run: |
          if [ "$CURE_FORCE" = 'true' ]; then
            python scripts/autocura.py "$CURE_COMMAND" --force
          else
            python scripts/autocura.py "$CURE_COMMAND"
          fi
      - name: Keep compatibility and integrity evidence; never upload pulled environment files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autocura-report-${{ github.run_id }}
          path: |
            onda-web/.autocura/state.json
            onda-web/.autocura/artifacts.json
            onda-web/public/autocura.json
          if-no-files-found: ignore
          retention-days: 30
